name: Validate portal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Validate question data
        run: python scripts/validate-data.py
      - name: Validate JSON documents
        run: |
          python -m json.tool data/questions.json > /dev/null
          python -m json.tool data/questions.schema.json > /dev/null
          python -m json.tool data/source_inventory.json > /dev/null
          python -m json.tool data/verification.json > /dev/null
      - name: Check required static files
        run: |
          test -s index.html
          test -s assets/style.css
          test -s assets/app.js
          test -f .nojekyll
